name: Deploy Pages

on:
  push:
    branches: [main]
    # The hub renders documents from all over the repository, so a change to any of them must redeploy it. The
    # release workflows dispatch this workflow by hand, because the pushes they make with GITHUB_TOKEN do not
    # trigger it.
    paths:
      - "apps/labs-hub/**"
      - "apps/matrix-design-system-showcase/**"
      - "apps/matrix-rain-showcase/**"
      - "packages/matrix-design-system/**"
      - "packages/matrix-component-store/**"
      - "packages/matrix-rain-webgpu/**"
      - "claude-plugins/**"
      - ".claude-plugin/marketplace.json"
      - "**/README.md"
      - "**/CHANGELOG.md"
      - "**/GLOSSARY*.md"
      - "**/docs/adr/**"
      - "brand/readme-hero.jpg"
      - "brand/featured/featured-horizontal.jpg"
      - "apps/website/src/content/blog/post/2026/09/11/monorepo-npm-workspaces-turborepo-nextjs-blog/media/monorepo-npm-workspaces-turborepo.jpg"
      - "apps/website/src/content/about-me/media/projects/matrix-rain-webgpu.png"
      - "apps/website/src/content/blog/post/2026/10/03/claude-code-mods-glossary-browser-domain-modeling-plugin-marketplace/media/claude-code-mods-glossary-browser.jpg"
      - "claude-plugins/image-peek/image-peek.jpg"
      - "package.json"
      - "apps/*/package.json"
      - "packages/*/package.json"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version-file: "package.json"
          cache: "npm"
      - name: Install dependencies
        run: npm ci
      - name: Build the Labs Hub and the Showcases
        run: >-
          npx turbo run build
          --filter=labs-hub
          --filter=matrix-design-system-showcase
          --filter=matrix-rain-showcase
      # The hub owns the root of the site; each Showcase owns a folder. Copying the hub first and refusing to
      # go on if it emitted either folder keeps a Showcase from being overwritten, or overwriting the hub.
      - name: Assemble the site
        run: |
          for reserved in design-system matrix-rain; do
            if [ -e "apps/labs-hub/dist/$reserved" ]; then
              echo "::error::The Labs Hub emitted /$reserved/, which belongs to a Showcase."
              exit 1
            fi
          done
          mkdir -p _site
          cp -r apps/labs-hub/dist/. _site/
          cp -r apps/matrix-design-system-showcase/dist _site/design-system
          cp -r apps/matrix-rain-showcase/dist _site/matrix-rain
          echo "assembled:" && find _site -maxdepth 2 -name index.html
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
