name: Release package

# Without this every run in the Actions list is titled "Release package", so a release history is
# unreadable without opening each one. inputs is available to run-name, and dry_run arrives as a
# real boolean, the same way the release step below already relies on.
run-name: Release ${{ inputs.package }} (${{ inputs.increment }}${{ inputs.dry_run && ', dry run' || '' }})

# Manual on purpose: these are public artifacts, and a release should be a decision rather than a
# side effect of merging. Mirrors the flow matrix-rain-webgpu already uses.
on:
  workflow_dispatch:
    inputs:
      package:
        description: "Which package to release"
        type: choice
        options:
          - matrix-component-store
          - matrix-design-system
          - matrix-rain-webgpu
        required: true
      increment:
        description: 'Which release to cut ("initial" publishes the version already in package.json)'
        type: choice
        options: [initial, patch, minor, major, beta, major-beta]
        default: patch
      dry_run:
        description: "Dry run (no publish, tag or push)"
        type: boolean
        default: true

permissions:
  contents: write # push the bump/changelog commit + tag, create the GH release
  id-token: write # OIDC token for trusted publishing (+ automatic provenance)
  actions: write # dispatch pages.yml once the release is on main

jobs:
  release:
    name: Release ${{ inputs.package }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0 # full history so conventional-changelog can diff tags
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version-file: "package.json"
          cache: "npm"
          registry-url: "https://registry.npmjs.org"
      # Trusted publishing needs npm >= 11.5.1. Pinned to the 11.x line rather than @latest: the
      # repo declares npm ^11.0.0 in devEngines, and npm 12 both contradicts that and changed the
      # shape of `npm pack --json`, which broke the verification step on its release day.
      - name: Use an npm that supports trusted publishing
        run: npm install -g "npm@^11.5.1"
      - name: Install dependencies
        run: npm ci
      # Never publish a tarball that has not been proven installable. This builds every package
      # itself: verification packs them all, so a build scoped to the selected package would leave
      # the other one without a dist and fail here for the wrong reason.
      - name: Verify the published surface
        run: npm run verify-packages
      - name: Configure git identity
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
      - name: Map increment to release-it args
        id: args
        run: |
          case "${{ inputs.increment }}" in
            initial)     echo "args=--no-increment" >> "$GITHUB_OUTPUT" ;;
            beta)        echo "args=--preRelease=beta" >> "$GITHUB_OUTPUT" ;;
            major-beta)  echo "args=major --preRelease=beta" >> "$GITHUB_OUTPUT" ;;
            *)           echo "args=${{ inputs.increment }}" >> "$GITHUB_OUTPUT" ;;
          esac
      - name: Release
        working-directory: packages/${{ inputs.package }}
        run: npx release-it ${{ steps.args.outputs.args }} ${{ inputs.dry_run && '--dry-run' || '' }} --ci
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # No NPM_TOKEN — OIDC trusted publishing authenticates the publish.

      # The push the release step makes with GITHUB_TOKEN does not trigger pages.yml, and the Labs Hub shows this
      # release's version and changelog, so the redeploy is requested explicitly.
      - name: Redeploy the Labs Hub
        if: ${{ !inputs.dry_run }}
        run: gh workflow run pages.yml --ref "${{ github.event.repository.default_branch }}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
